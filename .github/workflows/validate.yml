name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Schema is valid JSON Schema
        run: |
          python -c "
          import json, jsonschema
          s = json.load(open('schema/intent-contract.schema.json'))
          jsonschema.Draft202012Validator.check_schema(s)
          print('schema OK')
          "

      - name: Valid example contracts must pass
        run: python tools/validate_contract.py examples/*.yaml

      - name: Invalid example contracts must fail
        run: |
          if python tools/validate_contract.py examples/invalid/*.yaml; then
            echo "::error::Invalid examples unexpectedly passed validation"
            exit 1
          else
            echo "Invalid examples correctly rejected"
          fi

      - name: Unit tests
        run: python -m pytest -q

      - name: CITATION.cff and .zenodo.json parse
        run: |
          python -c "import yaml, json; yaml.safe_load(open('CITATION.cff')); json.load(open('.zenodo.json')); print('metadata OK')"
