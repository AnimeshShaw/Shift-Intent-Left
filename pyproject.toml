[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sil"
version = "0.1.0"
description = "Reference implementation of the Shift Intent Left enforcement point: admissibility, Intent Drift, and a tamper-evident action trace."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Animesh Shaw", email = "animesh15b@iimk.edu.in" }]
dependencies = ["pyyaml>=6.0", "jsonschema>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
